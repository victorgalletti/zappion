name: API check

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api-check.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api-check.yml"]

defaults:
  run:
    working-directory: api

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: cd supabase/functions && deno lint && deno check .
