name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security vulnerabilities go through SECURITY.md, never a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [Web inbox, Windows app, API / Edge Functions, MCP, Setup or deploy, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit or release, and whether you self-host locally or on Supabase Cloud.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove phone numbers, tokens and message content first.
