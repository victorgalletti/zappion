name: Feature request
description: Suggest something Zappion should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you imagine it working. Mockups welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways around it you considered.
